name: Paperclip Global Commerce Company

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'paperclip/prismbay-global-commerce/**'
      - 'services/physical-orders/catalog.prismbay-live.json'
      - 'config/retail-commercial-authorization.json'
      - 'scripts/global-commerce-opportunity-engine.mjs'
      - 'scripts/global-commerce-opportunity-engine.test.mjs'
      - 'scripts/catalog-opportunity-bridge.mjs'
      - 'scripts/catalog-opportunity-bridge.test.mjs'
      - '.github/workflows/paperclip-global-commerce.yml'
  push:
    branches: [main]
    paths:
      - 'paperclip/prismbay-global-commerce/**'
      - 'services/physical-orders/catalog.prismbay-live.json'
      - 'config/retail-commercial-authorization.json'
      - 'scripts/global-commerce-opportunity-engine.mjs'
      - 'scripts/global-commerce-opportunity-engine.test.mjs'
      - 'scripts/catalog-opportunity-bridge.mjs'
      - 'scripts/catalog-opportunity-bridge.test.mjs'
      - '.github/workflows/paperclip-global-commerce.yml'

permissions:
  contents: read

jobs:
  opportunity-company:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out company
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate opportunity, acceleration and economics controls
        run: node --test scripts/global-commerce-opportunity-engine.test.mjs scripts/catalog-opportunity-bridge.test.mjs
      - name: Run independent global commerce board
        run: node scripts/global-commerce-opportunity-engine.mjs
      - name: Run existing-catalog demand acceleration bridge
        run: node scripts/catalog-opportunity-bridge.mjs
      - name: Check current public research sources are reachable
        shell: bash
        run: |
          set -e
          for url in \
            'https://sell.amazon.com/blog/products-to-sell' \
            'https://sell.amazon.com/blog/product-ideas' \
            'https://www.shopify.com/blog/best-dropshipping-products' \
            'https://www.shopify.com/blog/retail-holiday-calendar' \
            'https://www.ebay.com/sellercenter/selling/what-to-sell' \
            'https://shop.tiktok.com/us/k/top-5-cleaning-products' \
            'https://shop.tiktok.com/us/k/crevice-cleaning-brush' \
            'https://shop.tiktok.com/us/k/drain-hair-catcher' \
            'https://shop.tiktok.com/us/k/pet-hair-removers' \
            'https://shop.tiktok.com/us/k/car-accessories-finds'; do
            code=$(curl -L -A 'Mozilla/5.0 PrismBayResearch/3.0' -sS -o /dev/null -w '%{http_code}' --max-time 25 "$url" || true)
            echo "$code $url"
            test "$code" -ge 200 -a "$code" -lt 500
          done
      - name: Retain Paperclip global commerce boards
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-global-commerce-${{ github.run_id }}
          path: |
            growth-reports/global-commerce-opportunities.json
            growth-reports/catalog-opportunity-bridge.json
          if-no-files-found: error
          retention-days: 14
