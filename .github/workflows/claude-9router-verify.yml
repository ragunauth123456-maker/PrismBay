name: Claude 9Router Integration Checks

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'package.json'
      - '.vscode/tasks.json'
      - 'docs/CLAUDE_9ROUTER_CLOUD.md'
      - 'docs/AI_COUNCIL.md'
      - 'scripts/claude-9router.sh'
      - 'scripts/claude-9router.test.sh'
      - 'scripts/claude-9router-auto.mjs'
      - '.github/workflows/claude-9router-verify.yml'
      - '.github/workflows/claude-free-issue-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Bash gateway wrapper
        run: bash scripts/claude-9router.test.sh
      - name: Validate one-command automation
        run: |
          node --check scripts/claude-9router-auto.mjs
          node scripts/claude-9router-auto.mjs --self-test
