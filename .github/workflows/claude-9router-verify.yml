name: Claude 9Router Integration Checks

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'docs/CLAUDE_9ROUTER_CLOUD.md'
      - 'scripts/claude-9router.sh'
      - 'scripts/claude-9router.test.sh'
      - '.github/workflows/claude-9router-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Bash and mock 9Router integration
        run: bash scripts/claude-9router.test.sh
