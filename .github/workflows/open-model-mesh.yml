name: Open-Weight Five-Model Mesh

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: open-model-mesh-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  council:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, '[OPEN-MESH]') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start local Ollama service
        shell: bash
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NUM_PARALLEL: "1"
          OLLAMA_MAX_LOADED_MODELS: "1"
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Prepare owner-approved council task
        env:
          RAW_TASK: ${{ github.event.comment.body }}
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$RAW_TASK" > /tmp/open-mesh-task.txt

      - name: Run Qwen + Llama + Mistral + DeepSeek + Gemma
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11434
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if grep -qi '#smoke' /tmp/open-mesh-task.txt; then
            extra+=(--smoke)
          fi
          node scripts/open-model-council.mjs \
            --prompt-file=/tmp/open-mesh-task.txt \
            --output-file=/tmp/open-mesh-output.md \
            "${extra[@]}"

      - name: Post model-mesh response
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/open-mesh-output.md', 'utf8').trim();
            if (body.length > 59000) {
              body = body.slice(0, 59000) + '\n\n[Output truncated by GitHub comment limit.]';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Report model-mesh failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Open-model mesh did not complete. Workflow: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
