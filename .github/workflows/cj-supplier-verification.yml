name: PrismBay CJ Supplier Verification

# Uses the repository secret CJ_API_KEY only inside GitHub-hosted runners.
# Fails closed on product name, variant inventory, price and freight estimates.
# Read-only: no orders, payments, listing, email or publishing.
on:
  schedule:
    - cron: '17 0,6,12,18 * * *' # Four 3-product batches/day, bounded CJ API checks
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cj-supplier-verification.yml'
      - 'scripts/cj-match-policy.mjs'
      - 'scripts/cj-review-board.mjs'

permissions:
  contents: write

concurrency:
  group: prismbay-cj-supplier-verification
  cancel-in-progress: false

jobs:
  verify-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate and verify CJ supplier data
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {hasApprovedProductClass, matchesIntendedProduct} from './scripts/cj-match-policy.mjs';
          import { parseCJFreight, freightRequest, chooseQuote } from './scripts/cj-freight-policy.mjs';
          import { createCJReadOnlyClient } from './scripts/cj-api-limiter.mjs';
          
          // Explicit product-class requirements prevent CJ's fuzzy search from selecting
          // unrelated merchandise. New categories remain unverified until reviewed.
          function positiveNumber(value) {
            if (value === null || value === undefined || typeof value === 'boolean' || String(value).trim() === '') return null;
            const parsed = Number(value);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
          }
          
          function count(value) {
            const n = positiveNumber(value);
            return n !== null && Number.isInteger(n) ? n : 0;
          }
          
          function price(item, variant = null) {
            return positiveNumber(variant?.variantSellPrice) ??
              positiveNumber(item?.nowPrice) ??
              positiveNumber(item?.discountPrice) ??
              positiveNumber(item?.sellPrice);
          }
          
          function eligibleProducts(products, candidate) {
            return products.filter(item =>
              String(item?.saleStatus) === '3' &&
              Number(item?.verifiedWarehouse) === 1 &&
              count(item?.totalVerifiedInventory) >= 10 &&
              price(item) !== null &&
              matchesIntendedProduct(candidate, item?.nameEn)
            ).sort((a, b) => count(b.totalVerifiedInventory) - count(a.totalVerifiedInventory));
          }
          
          // Reproduce the false positives from the first live run and fail before
          // connecting to CJ if a later edit removes these safeguards.
          assert.equal(matchesIntendedProduct({slug:'cordless-handheld-vacuum'}, 'VEVOR Stand Airless Paint Sprayer'), false);
          assert.equal(matchesIntendedProduct({slug:'hanging-closet-organizer'}, 'Shoe Cabinet With 2 Flip Drawers'), false);
          assert.equal(matchesIntendedProduct({slug:'roll-up-dish-rack'}, 'Flower Print Lace-up Sneakers'), false);
          assert.equal(matchesIntendedProduct({slug:'cordless-handheld-vacuum'}, 'Cordless Portable Handheld Vacuum Cleaner'), true);
          assert.equal(positiveNumber(null), null);
          assert.equal(positiveNumber(0), null);
          assert.equal(positiveNumber('0'), null);
          assert.equal(positiveNumber('9.64'), 9.64);
          assert.equal(price({nowPrice:0, discountPrice:null, sellPrice:'23.50'}), 23.5);
          assert.equal(eligibleProducts([{nameEn:'VEVOR Stand Airless Paint Sprayer', saleStatus:'3', verifiedWarehouse:1, totalVerifiedInventory:3835, sellPrice:55}], {slug:'cordless-handheld-vacuum'}).length, 0);
          console.log('Product-matching, price and prior false-positive safeguards PASS');
          assert.equal(matchesIntendedProduct({slug:'cordless-handheld-vacuum'}, 'VEVOR Wet Dry Vac, 2.6 Gallon, Portable Shop Vacuum'), false);
          assert.equal(matchesIntendedProduct({slug:'hanging-closet-organizer'}, 'Wall-door Mounted Jewelry Wardrobe Large Capacity Mirror And LED Light Lockable Organizer'), false);
          if (process.env.CJ_AUDIT_SELF_TEST_ONLY === '1') process.exit(0);
          
          const apiKey = String(process.env.CJ_API_KEY || '').trim();
          if (!apiKey) throw new Error('CJ_API_KEY repository secret is missing.');
          const BASE = 'https://developers.cjdropshipping.com/api2.0/v1';
          const headers = token => ({
            'CJ-Access-Token': token,
            'Content-Type': 'application/json',
            'User-Agent': 'PrismBay-CJ-Verification/2.0',
          });
          // Enforce free-tier request pacing and bounded 429 retry across authentication,
          // product search, variant stock and the two shipping-quote attempts.
          const jsonFetch = createCJReadOnlyClient();

          const auth = await jsonFetch(BASE + '/authentication/getAccessToken', {
            method: 'POST',
            headers: {'Content-Type':'application/json','User-Agent':'PrismBay-CJ-Verification/2.0'},
            body: JSON.stringify({apiKey}),
          });
          const token = String(auth?.data?.accessToken || '');
          if (!token) throw new Error('CJ authentication succeeded without an access token.');
          console.log('::add-mask::' + token);
          console.log('CJ authentication PASS');
          
          const catalog = JSON.parse(await fs.readFile('public/viral-candidates.json', 'utf8'));
          const allCandidates = Array.isArray(catalog?.candidates) ? catalog.candidates.slice(0, 12) : [];
          // Four 3-product batches per day cover twelve research candidates with bounded API use.
          const slot = process.env.GITHUB_EVENT_NAME === 'schedule' ? Math.floor(new Date().getUTCHours() / 6) : 0;
          const candidates = allCandidates.slice(slot * 3, slot * 3 + 3);
          if (candidates.length === 0) throw new Error('No research candidates available for supplier verification.');
          function flatten(payload) {
            const groups = payload?.data?.content;
            return Array.isArray(groups) ? groups.flatMap(group => Array.isArray(group?.productList) ? group.productList : []) : [];
          }
          
          const results = [];
          for (const candidate of candidates) {
            const base = {
              slug:String(candidate?.slug || ''), candidate: String(candidate?.name || ''), query: String(candidate?.query || ''),
              supplierVerified: false, variantInventoryVerified: false,
              freightVerified: false, fulfillmentReady: false,
            };
            if (!hasApprovedProductClass(candidate?.slug)) {
              results.push({...base, status:'manual_category_review', reason:'Candidate has no approved product-class validation rule.'});
              continue;
            }
            const url = new URL(BASE + '/product/listV2');
            url.searchParams.set('page', '1');
            url.searchParams.set('size', '20');
            url.searchParams.set('keyWord', base.query);
            url.searchParams.set('countryCode', 'US');
            url.searchParams.set('startWarehouseInventory', '10');
            url.searchParams.set('verifiedWarehouse', '1');
            url.searchParams.set('sort', 'desc');
            url.searchParams.set('orderBy', '1');
            url.searchParams.append('features', 'enable_category');
          
            let search;
            try {
              search = await jsonFetch(url, { headers: headers(token) });
            } catch (error) {
              results.push({...base, status:'search_error', reason: error instanceof Error ? error.message : 'CJ search failed.'});
              continue;
            }
            const products = flatten(search);
            const eligible = eligibleProducts(products, candidate);
            if (!eligible.length) {
              results.push({...base, status:'manual_supplier_match_required',
                candidatesReturned:products.length,
                reason:'CJ search returned no correctly matched product with positive price and verified US inventory. Unrelated products and zero-cost records are excluded.'});
              continue;
            }
          
            const item = eligible[0];
            // CJ's product/query endpoint is a summary. Variant identities and
            // physical US stock come from the separate documented endpoints.
            const variantsUrl = new URL(BASE + '/product/variant/query');
            variantsUrl.searchParams.set('pid', String(item.id));
            variantsUrl.searchParams.set('countryCode', 'US');
            let variant = null;
            let variantInventoryVerified = false;
            let variantCheck = 'variant_details_unavailable';
            try {
              const variantsResponse = await jsonFetch(variantsUrl, { headers: headers(token) });
              const variants = Array.isArray(variantsResponse?.data) ? variantsResponse.data : [];
              variantCheck = 'manual_variant_inventory_check_required';
              // Bound API traffic and require same PID, VID, positive unit price and CJ-held US stock.
              for (const choice of variants.slice(0, 5)) {
                if (String(choice?.pid || '') !== String(item.id) || !choice?.vid ||
                    positiveNumber(choice?.variantSellPrice) === null) continue;
                const stockUrl = new URL(BASE + '/product/stock/queryByVid');
                stockUrl.searchParams.set('vid', String(choice.vid));
                let stockResponse;
                try { stockResponse = await jsonFetch(stockUrl, { headers: headers(token) }); }
                catch { continue; }
                const stockRows = Array.isArray(stockResponse?.data) ? stockResponse.data : [];
                const hasPhysicalUsInventory = stockRows.some(row =>
                  String(row?.vid || '') === String(choice.vid) &&
                  String(row?.countryCode || '').toUpperCase() === 'US' &&
                  count(row?.totalInventoryNum) >= 10 &&
                  count(row?.cjInventoryNum) >= 1
                );
                if (!hasPhysicalUsInventory) continue;
                variant = choice;
                variantInventoryVerified = true;
                variantCheck = 'verified_us_cj_stock';
                break;
              }
            } catch {
              variantCheck = 'variant_details_unavailable';
            }

            // Verify shipping independently of the supplier match. A zero-dollar
            // result is ambiguous, NOT evidence of approved free shipping.
            // If country-only quotes have no positive price, retry once using
            // an illustrative US ZIP. A sample ZIP never validates a buyer's address.
            const freightOptions = [];
            let zeroPriceQuoteCount = 0;
            let freightQuoteScope = null;
            let freightDiagnostic = variantInventoryVerified ? 'not_quoted' : 'variant_stock_unverified';
            if (variantInventoryVerified && variant?.vid) {
              let countryQuote = null;
              let exampleQuote = null;
              try {
                const country = await jsonFetch(BASE + '/logistic/freightCalculate', {
                  method:'POST', headers:headers(token),
                  body:JSON.stringify(freightRequest(String(variant.vid))),
                });
                countryQuote = parseCJFreight(country, 'country_estimate');
              } catch {
                freightDiagnostic = 'country_quote_api_error';
              }
              if (!countryQuote || countryQuote.offers.length === 0) {
                try {
                  const zip = '10001'; // Illustrative NYC ZIP only, never a customer delivery quote
                  const sample = await jsonFetch(BASE + '/logistic/freightCalculate', {
                    method:'POST', headers:headers(token),
                    body:JSON.stringify(freightRequest(String(variant.vid), zip)),
                  });
                  exampleQuote = parseCJFreight(sample, 'example_zip_estimate', zip);
                } catch {
                  freightDiagnostic = 'illustrative_zip_quote_api_error';
                }
              }
              const evaluated = chooseQuote(countryQuote || parseCJFreight({data:[]}), exampleQuote);
              freightOptions.push(...evaluated.offers);
              zeroPriceQuoteCount = evaluated.zeroPriced;
              freightQuoteScope = evaluated.scope;
              if (freightOptions.length) freightDiagnostic = evaluated.diagnostic;
              else if (evaluated.zeroPriced) freightDiagnostic = 'zero_priced_methods_require_supplier_confirmation';
              else if (freightDiagnostic === 'not_quoted') freightDiagnostic = evaluated.diagnostic;
            }

            results.push({...base,
              supplierVerified:true,
              variantInventoryVerified,
              freightVerified:variantInventoryVerified && freightOptions.length > 0,
              status: !variantInventoryVerified ? 'supplier_product_matched_variant_pending' :
                !freightOptions.length ? 'supplier_matched_freight_pending' : 'supplier_matched_us_freight_estimate',
              product:{
                id:String(item.id), sku:item.sku || item.spu || null,
                name:item.nameEn, productCostUsd:price(item,variant),
                verifiedProductInventory:count(item.totalVerifiedInventory),
                warehouse:'US', variantId:variant?.vid || null, variantSku:variant?.variantSku || null,
              }, variantCheck, zeroPriceQuoteCount, freightOptions, freightQuoteScope, freightDiagnostic,
              shippingDisclaimer:'US-to-US country or illustrative ZIP estimate only. Confirm the actual buyer ZIP, carrier, variant, total landed cost and supplier acceptance before any sale.',
              fulfillmentNote:'No ordering, payment, listing or automatic publishing is enabled.',
            });
          }
          
          const report = {
            schemaVersion:3, checkedAt:new Date().toISOString(), market:'US',
            batchSlot:slot, catalogCandidateCount:allCandidates.length,
            authentication:'verified', apiKeyExposed:false, accessTokenExposed:false,
            ordersEnabled:false, paymentsEnabled:false, automaticListingEnabled:false, automaticPublishingEnabled:false,
            candidateCount:results.length,
            supplierVerifiedCount:results.filter(x=>x.supplierVerified).length,
            variantInventoryVerifiedCount:results.filter(x=>x.variantInventoryVerified).length,
            freightEstimateCount:results.filter(x=>x.freightVerified).length,
            allRequireManualCommercialApproval:true,
            results,
          };
          await fs.mkdir('growth-reports',{recursive:true});
          await fs.writeFile('growth-reports/cj-supplier-verification.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({authentication:report.authentication,candidates:report.candidateCount,
            matchedSupplierProducts:report.supplierVerifiedCount,verifiedVariants:report.variantInventoryVerifiedCount,
            estimatedFreight:report.freightEstimateCount,ordersEnabled:false}));
          JS

      - name: Independently audit product identity and prepare worker assignments
        run: |
          node --test scripts/cj-api-limiter.test.mjs scripts/cj-match-policy.test.mjs scripts/cj-freight-policy.test.mjs scripts/cj-review-board.test.mjs
          node scripts/cj-review-board.mjs

      - name: Update sanitized public worker review, not the raw supplier report
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f growth-reports/cj-worker-review.json
          if git diff --cached --quiet; then echo 'CJ review unchanged'; exit 0; fi
          git commit -m 'chore: update safe read-only CJ worker review'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Concurrent change requires owner review; never force push'
              exit 1
            fi
            git push origin HEAD:main && exit 0
            sleep "$((attempt * 2))"
          done
          exit 1

      - name: Retain CJ verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-cj-supplier-verification-${{ github.run_id }}
          path: |
            growth-reports/cj-supplier-verification.json
            growth-reports/cj-worker-review.json
          if-no-files-found: error
          retention-days: 7
