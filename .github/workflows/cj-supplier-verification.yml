name: PrismBay CJ Supplier Verification

# Uses the repository secret CJ_API_KEY only inside GitHub-hosted runners.
# Read-only supplier verification: no orders, payments, listing, email or publishing.
on:
  schedule:
    - cron: '17 4 * * *' # 00:17 Guyana, 30 min after daily candidate research
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prismbay-cj-supplier-verification
  cancel-in-progress: false

jobs:
  verify-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate and verify CJ supplier data
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';

          const apiKey = String(process.env.CJ_API_KEY || '').trim();
          if (!apiKey) throw new Error('CJ_API_KEY repository secret is missing.');

          const BASE = 'https://developers.cjdropshipping.com/api2.0/v1';
          const headers = token => ({
            'CJ-Access-Token': token,
            'Content-Type': 'application/json',
            'User-Agent': 'PrismBay-CJ-Verification/1.0'
          });

          async function jsonFetch(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              signal: AbortSignal.timeout(20000),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.result === false) {
              const code = payload?.code ?? response.status;
              const message = String(payload?.message || 'CJ request failed').slice(0, 180);
              throw new Error('CJ API ' + code + ': ' + message);
            }
            return payload;
          }

          const auth = await jsonFetch(BASE + '/authentication/getAccessToken', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'User-Agent': 'PrismBay-CJ-Verification/1.0' },
            body: JSON.stringify({ apiKey }),
          });
          const token = String(auth?.data?.accessToken || '');
          if (!token) throw new Error('CJ authentication succeeded without an access token.');
          console.log('::add-mask::' + token);
          console.log('CJ authentication PASS');

          const catalog = JSON.parse(await fs.readFile('public/viral-candidates.json', 'utf8'));
          const candidates = Array.isArray(catalog?.candidates) ? catalog.candidates.slice(0, 3) : [];
          if (!candidates.length) throw new Error('No candidate products are available for CJ verification.');

          function flatten(payload) {
            const groups = payload?.data?.content;
            if (!Array.isArray(groups)) return [];
            return groups.flatMap(group => Array.isArray(group?.productList) ? group.productList : []);
          }
          const number = value => Number.isFinite(Number(value)) ? Number(value) : null;

          const results = [];
          for (const candidate of candidates) {
            const url = new URL(BASE + '/product/listV2');
            url.searchParams.set('page', '1');
            url.searchParams.set('size', '10');
            url.searchParams.set('keyWord', String(candidate.query || candidate.name || ''));
            url.searchParams.set('countryCode', 'US');
            url.searchParams.set('startWarehouseInventory', '10');
            url.searchParams.set('verifiedWarehouse', '1');
            url.searchParams.set('sort', 'desc');
            url.searchParams.set('orderBy', '1');
            url.searchParams.append('features', 'enable_category');

            let search;
            try {
              search = await jsonFetch(url, { headers: headers(token) });
            } catch (error) {
              results.push({
                candidate: candidate.name,
                query: candidate.query,
                supplierVerified: false,
                freightVerified: false,
                fulfillmentReady: false,
                status: 'search_error',
                reason: error instanceof Error ? error.message : String(error),
              });
              continue;
            }

            const products = flatten(search);
            const eligible = products
              .filter(item =>
                String(item?.saleStatus) === '3' &&
                Number(item?.verifiedWarehouse) === 1 &&
                (number(item?.totalVerifiedInventory) || 0) >= 10 &&
                (number(item?.sellPrice) || 0) > 0
              )
              .sort((a, b) =>
                (number(b?.totalVerifiedInventory) || 0) - (number(a?.totalVerifiedInventory) || 0) ||
                (number(b?.listedNum) || 0) - (number(a?.listedNum) || 0)
              );

            if (!eligible.length) {
              results.push({
                candidate: candidate.name,
                query: candidate.query,
                supplierVerified: false,
                freightVerified: false,
                fulfillmentReady: false,
                status: 'no_verified_us_match',
                reason: 'No on-sale CJ match with at least 10 units of verified US warehouse inventory.',
              });
              continue;
            }

            const product = eligible[0];
            const detailUrl = new URL(BASE + '/product/query');
            detailUrl.searchParams.set('pid', String(product.id));
            detailUrl.searchParams.set('countryCode', 'US');

            let details = null;
            let variant = null;
            try {
              details = await jsonFetch(detailUrl, { headers: headers(token) });
              const variants = Array.isArray(details?.data?.variants) ? details.data.variants : [];
              variant = variants
                .filter(v => Array.isArray(v?.inventories) && v.inventories.some(i =>
                  String(i?.countryCode).toUpperCase() === 'US' && (number(i?.totalInventory) || 0) > 0
                ))
                .sort((a, b) => (number(b?.variantSellPrice) || 0) - (number(a?.variantSellPrice) || 0))[0] || variants[0] || null;
            } catch {}

            let freight = [];
            if (variant?.vid) {
              try {
                const freightPayload = await jsonFetch(BASE + '/logistic/freightCalculate', {
                  method: 'POST',
                  headers: headers(token),
                  body: JSON.stringify({
                    startCountryCode: 'US',
                    endCountryCode: 'US',
                    products: [{ quantity: 1, vid: variant.vid }],
                  }),
                });
                freight = Array.isArray(freightPayload?.data) ? freightPayload.data
                  .filter(row => number(row?.logisticPrice) !== null)
                  .sort((a, b) => Number(a.logisticPrice) - Number(b.logisticPrice))
                  .slice(0, 5)
                  .map(row => ({
                    name: row.logisticName || null,
                    usd: number(row.logisticPrice),
                    aging: row.logisticAging || null,
                  })) : [];
              } catch {}
            }

            results.push({
              candidate: candidate.name,
              query: candidate.query,
              supplierVerified: true,
              freightVerified: freight.length > 0,
              fulfillmentReady: false,
              status: freight.length ? 'supplier_and_freight_verified' : 'supplier_verified_freight_pending',
              product: {
                id: product.id,
                sku: product.sku || product.spu || null,
                name: product.nameEn || candidate.name,
                productCostUsd: number(product.nowPrice) ?? number(product.discountPrice) ?? number(product.sellPrice),
                verifiedInventory: number(product.totalVerifiedInventory),
                deliveryCycleDays: product.deliveryCycle || null,
                warehouse: 'US',
                variantId: variant?.vid || null,
                variantSku: variant?.variantSku || null,
              },
              freightOptions: freight,
              fulfillmentNote: 'No order or payment action is enabled. Fulfillment remains owner-approved per order.',
            });
          }

          const report = {
            schemaVersion: 1,
            checkedAt: new Date().toISOString(),
            market: 'US',
            authentication: 'verified',
            apiKeyExposed: false,
            accessTokenExposed: false,
            ordersEnabled: false,
            paymentsEnabled: false,
            automaticListingEnabled: false,
            automaticPublishingEnabled: false,
            candidateCount: results.length,
            supplierVerifiedCount: results.filter(x => x.supplierVerified).length,
            freightVerifiedCount: results.filter(x => x.freightVerified).length,
            results,
          };

          await fs.mkdir('growth-reports', { recursive: true });
          await fs.writeFile('growth-reports/cj-supplier-verification.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({
            authentication: report.authentication,
            candidates: report.candidateCount,
            supplierVerified: report.supplierVerifiedCount,
            freightVerified: report.freightVerifiedCount,
            ordersEnabled: report.ordersEnabled,
          }));
          JS

      - name: Retain CJ verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-cj-supplier-verification-${{ github.run_id }}
          path: growth-reports/cj-supplier-verification.json
          if-no-files-found: error
          retention-days: 3
