name: PrismBay Paperclip Commerce Group

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paperclip/prismbay-commerce-group/**'
      - 'config/sales-strategy-portfolio.json'
      - 'config/strict-kpis.json'
      - 'config/autonomous-growth-system.json'
      - 'scripts/paperclip-commerce-group.mjs'
      - 'scripts/paperclip-commerce-group.test.mjs'
      - 'scripts/paperclip-no-idle-guard.mjs'
      - 'scripts/paperclip-no-idle-guard.test.mjs'
      - 'scripts/paperclip-sales-strategy-engine.mjs'
      - 'scripts/paperclip-sales-strategy-engine.test.mjs'
      - 'scripts/prioritize-commercial-candidates.mjs'
      - 'scripts/prioritize-commercial-candidates.test.mjs'
      - 'scripts/strict-kpi-scorecard.mjs'
      - 'scripts/strict-kpi-scorecard.test.mjs'
      - 'scripts/ceo-autonomous-growth-engine.mjs'
      - 'scripts/ceo-autonomous-growth-engine.test.mjs'
      - 'scripts/autonomous-company-task-allocator.mjs'
      - 'scripts/autonomous-company-task-allocator.test.mjs'
      - '.github/workflows/paperclip-commerce-group.yml'
  workflow_run:
    workflows:
      - 'PrismBay Paperclip Revenue Ops'
      - 'Paperclip Global Commerce Company'
      - 'Paperclip Global Commerce CJ Sourcing'
      - 'PrismBay CJ Supplier Verification'
      - 'PrismBay Retail Promotion Swarm'
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'paperclip/prismbay-commerce-group/**'
      - 'config/sales-strategy-portfolio.json'
      - 'config/strict-kpis.json'
      - 'config/autonomous-growth-system.json'
      - 'scripts/paperclip-commerce-group.mjs'
      - 'scripts/paperclip-commerce-group.test.mjs'
      - 'scripts/paperclip-no-idle-guard.mjs'
      - 'scripts/paperclip-no-idle-guard.test.mjs'
      - 'scripts/paperclip-sales-strategy-engine.mjs'
      - 'scripts/paperclip-sales-strategy-engine.test.mjs'
      - 'scripts/prioritize-commercial-candidates.mjs'
      - 'scripts/prioritize-commercial-candidates.test.mjs'
      - 'scripts/strict-kpi-scorecard.mjs'
      - 'scripts/strict-kpi-scorecard.test.mjs'
      - 'scripts/ceo-autonomous-growth-engine.mjs'
      - 'scripts/ceo-autonomous-growth-engine.test.mjs'
      - 'scripts/autonomous-company-task-allocator.mjs'
      - 'scripts/autonomous-company-task-allocator.test.mjs'
      - '.github/workflows/paperclip-commerce-group.yml'

permissions:
  contents: read

concurrency:
  group: prismbay-paperclip-commerce-group
  cancel-in-progress: true

jobs:
  commerce-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate master execution contracts, organization, KPIs and autonomous growth system
        shell: bash
        run: |
          test -s paperclip/prismbay-commerce-group/MASTER_EXECUTION_PROMPT.md
          test -s paperclip/prismbay-commerce-group/NO_IDLE_UNTIL_FIRST_SALE.md
          test -s config/sales-strategy-portfolio.json
          test -s config/strict-kpis.json
          test -s config/autonomous-growth-system.json
          node --test scripts/paperclip-commerce-group.test.mjs scripts/paperclip-no-idle-guard.test.mjs scripts/paperclip-sales-strategy-engine.test.mjs scripts/prioritize-commercial-candidates.test.mjs scripts/strict-kpi-scorecard.test.mjs scripts/ceo-autonomous-growth-engine.test.mjs scripts/autonomous-company-task-allocator.test.mjs

      - name: Refresh independent opportunity board
        run: node scripts/global-commerce-opportunity-engine.mjs

      - name: Refresh current promotion readiness
        run: node scripts/retail-promotion-swarm.mjs

      - name: Refresh TikTok retail readiness
        run: node scripts/tiktok-retail-readiness.mjs

      - name: Refresh verified first-sale evidence
        run: node scripts/first-sale-verifier.mjs

      - name: Refresh existing revenue task board
        run: node scripts/paperclip-revenue-bridge.mjs

      - name: Prioritize commercially closest product
        run: node scripts/prioritize-commercial-candidates.mjs

      - name: Run diversified CEO sales strategy portfolio
        run: node scripts/paperclip-sales-strategy-engine.mjs

      - name: Run parent commercial control loop and First Sale War Room
        run: node scripts/paperclip-commerce-group.mjs

      - name: Enforce no-idle operation until first verified sale
        run: node scripts/paperclip-no-idle-guard.mjs

      - name: Score every company against strict KPIs
        run: node scripts/strict-kpi-scorecard.mjs

      - name: Convert weak KPIs and stale blockers into autonomous recovery work
        run: node scripts/ceo-autonomous-growth-engine.mjs

      - name: Allocate quantified recovery and growth tasks to all ten companies
        run: node scripts/autonomous-company-task-allocator.mjs

      - name: Retain executive dashboard, KPI scorecard and autonomous operating boards
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-commerce-group-${{ github.run_id }}
          path: |
            growth-reports/prismbay-commerce-group-dashboard.json
            growth-reports/strict-kpi-scorecard.json
            growth-reports/ceo-autonomous-growth-board.json
            growth-reports/evidence-debt-ledger.json
            growth-reports/autonomous-company-taskboard.json
            growth-reports/sales-strategy-board.json
            growth-reports/global-commerce-opportunities.json
            growth-reports/paperclip-revenue-board.json
            growth-reports/retail-promotion-swarm.json
            growth-reports/tiktok-retail-readiness.json
            growth-reports/first-sale-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: First Sale War Room, strict KPI and autonomous recovery summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('growth-reports/prismbay-commerce-group-dashboard.json','utf8'));
          const s=JSON.parse(fs.readFileSync('growth-reports/sales-strategy-board.json','utf8'));
          const k=JSON.parse(fs.readFileSync('growth-reports/strict-kpi-scorecard.json','utf8'));
          const g=JSON.parse(fs.readFileSync('growth-reports/ceo-autonomous-growth-board.json','utf8'));
          const t=JSON.parse(fs.readFileSync('growth-reports/autonomous-company-taskboard.json','utf8'));
          const w=d.firstSaleWarRoom || {};
          const n=d.noIdleUntilFirstSale || {};
          console.log('## PrismBay Commerce Group | CEO First Sale War Room');
          console.log(`- Verified sales: ${d.verifiedSales}`);
          console.log(`- Promotion-ready products: ${d.promotionEligibleCount}`);
          console.log(`- Concurrent sales strategies: ${s.concurrentStrategyCount}`);
          console.log(`- Acquisition/distribution paths: ${s.acquisitionPaths.map(x=>x.id).join(', ')}`);
          console.log(`- Current bottleneck: ${d.currentBottleneck.stage} / ${d.currentBottleneck.reason}`);
          console.log(`- Accountable company: ${d.currentBottleneck.owner}`);
          console.log(`- Closest product: ${w.closestProduct || 'none'}`);
          console.log(`- Remaining gates: ${(w.remainingGates || []).join(', ') || 'none'}`);
          console.log(`- Work actively running: ${(w.workActivelyRunning || []).join(', ') || 'none'}`);
          console.log(`- Alternatives being tested: ${(w.alternativePathsInProgress || []).join(', ') || 'none'}`);
          console.log(`- Next-best candidate: ${w.nextBestProduct || 'none'}`);
          console.log(`- Active company assignments: ${(n.assignments || []).length}`);
          console.log(`- Next cycle required before first sale: ${n.nextCycleRequired === true}`);
          console.log(`- External owner action required: ${(d.externalActionsAwaitingOwnerApproval || []).join(', ') || 'none'}`);
          console.log(`- Next commercial action: ${d.scoreboard?.nextAction || 'none'}`);
          console.log('');
          console.log('## Strict KPI Scorecard');
          console.log(`- Parent controller: ${k.parentController.score}/100 (${k.parentController.band})`);
          for (const [id,row] of Object.entries(k.companies)) {
            console.log(`- ${id}: ${row.score}/100 (${row.band}); evidence gaps=${row.evidenceGaps.length}`);
          }
          console.log('- Rule: missing evidence receives zero credit; activity alone is not success; integrity breach = critical.');
          console.log('');
          console.log('## Autonomous CEO Recovery');
          console.log(`- Mode: ${g.mode}`);
          console.log(`- CEO priority: ${g.ceoPriority}`);
          console.log(`- Recovery sprints: ${g.recoverySprints.length}`);
          console.log(`- Open evidence debt: ${g.evidenceDebtCount}`);
          console.log(`- Products actively in race: ${g.productRaceCount}`);
          console.log(`- Blocker escalation: ${g.blockerEscalation.stage} (${g.blockerEscalation.ageMinutes ?? 'unknown'} minutes)`);
          console.log(`- Critical companies: ${g.portfolioControls.criticalCompanies.join(', ') || 'none'}`);
          console.log(`- Red companies: ${g.portfolioControls.redCompanies.join(', ') || 'none'}`);
          console.log(`- Parallel route deficit: ${g.portfolioControls.parallelRouteDeficit}`);
          console.log(`- Red-team checks: ${g.redTeam.checks.length}`);
          console.log(`- Quantified active tasks: ${t.totalTasks} across ${t.activeCompanies} companies`);
          for (const [id,row] of Object.entries(t.recoveryCoverage)) {
            console.log(`- taskboard ${id}: ${row.taskCount} task(s); KPI=${row.kpiBand}; evidence debt=${row.evidenceDebt.length}`);
          }
          NODE
