name: Open Model Council

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  council:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        startsWith(github.event.issue.title, '[OPEN-MODEL-COUNCIL]') &&
        github.event.comment.user.login == github.repository_owner
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start private Ollama service
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Prepare council task
        if: github.event_name == 'issue_comment'
        env:
          TASK: ${{ github.event.comment.body }}
        run: |
          umask 077
          printf '%s\n' "$TASK" > /tmp/open-model-task.txt

      - name: Run connectivity smoke test
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf '%s\n' 'Reply with one short sentence identifying your model family.' > /tmp/open-model-task.txt
          node scripts/open-model-council.mjs \
            --smoke \
            --prompt-file=/tmp/open-model-task.txt \
            --output-file=/tmp/open-model-council.md
          cat /tmp/open-model-council.md

      - name: Run automated five-family mesh
        if: github.event_name == 'issue_comment'
        run: |
          node scripts/open-model-council.mjs \
            --prompt-file=/tmp/open-model-task.txt \
            --output-file=/tmp/open-model-council.md

      - name: Post council response
        if: github.event_name == 'issue_comment' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/open-model-council.md', 'utf8').trim();
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n[Council output truncated by GitHub comment limit.]';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Report council failure
        if: github.event_name == 'issue_comment' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Open-model council run failed. Workflow: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
