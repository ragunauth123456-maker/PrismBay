name: PrismBay Free Cloud Operations

on:
  schedule:
    - cron: '47 */6 * * *' # Read the CJ review after its :17 supplier batch finishes
  workflow_dispatch:
  push:
    branches: [free-cloud-ops-20260925, main]
    paths:
      - '.github/workflows/free-cloud-ops.yml'
      - 'scripts/revenue-health-check*'
      - 'scripts/viral-product-engine.mjs'
      - 'scripts/dropshipping-dispatch.mjs'
      - 'scripts/freellm-sales-worker.mjs'
      - 'scripts/freellm-sales-worker.test.mjs'
      - 'scripts/owned-sales-page-worker.mjs'
      - 'scripts/owned-sales-page-worker.test.mjs'
      - 'scripts/sales-sitemap-sync.mjs'
      - 'scripts/sales-sitemap-sync.test.mjs'

permissions:
  contents: write

concurrency:
  group: prismbay-commerce-board-writers
  cancel-in-progress: false

jobs:
  cloud-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out existing PrismBay code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing offline regression tests
        run: node --test scripts/revenue-health-check.test.mjs scripts/issue62-monitoring.test.mjs scripts/youtube-publishing-guard.test.mjs scripts/youtube-publishing-gateway.test.mjs scripts/youtube-publishing-entrypoint.test.mjs scripts/cj-api-limiter.test.mjs scripts/cj-match-policy.test.mjs scripts/cj-freight-policy.test.mjs scripts/cj-review-board.test.mjs scripts/dropshipping-dispatch.test.mjs scripts/organic-growth-agent.test.mjs scripts/board-freshness.test.mjs scripts/freellm-sales-worker.test.mjs scripts/owned-sales-page-worker.test.mjs scripts/sales-sitemap-sync.test.mjs
      - name: Poll approved Cloudflare task requests (optional)
        env:
          PRISMBAY_CF_ENDPOINT: ${{ secrets.PRISMBAY_CF_ENDPOINT }}
          PRISMBAY_CF_REPORT_TOKEN: ${{ secrets.PRISMBAY_CF_REPORT_TOKEN }}
        run: node scripts/free-cloud-sync.mjs poll
      - name: Research and refresh the existing public attention catalog
        run: |
          node scripts/viral-product-engine.mjs
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('public/viral-catalog.json')); if(c.products.length<9 || !c.products.some(p=>p.evidence.sourcesAvailable.length)) { console.error('No verified public feed or catalog incomplete'); process.exit(1); }"
      - name: Publish public catalog from the cloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/viral-catalog.json growth-reports/viral-content-queue.json
          if git diff --cached --quiet; then echo 'Public catalog unchanged'; exit 0; fi
          git commit -m 'chore: refresh PrismBay public catalog from free cloud'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Concurrent edit requires review. No force push.'
              exit 1
            fi
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      - name: Run existing public-data AI growth workers
        shell: bash
        run: |
          roles=('Trend Scout' 'Hook/Creative Writer' 'Storefront CRO Auditor' 'Creator/Partner Scout' 'Publisher' 'Analytics Reviewer' 'Offer Optimizer' 'GitHub Support Scout')
          for role in "${roles[@]}"; do
            echo "Running $role"
            node scripts/organic-growth-agent.mjs "$role"
          done
      - name: Run FreeLLM sales intelligence with safe fallback
        env:
          FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        run: node scripts/freellm-sales-worker.mjs
      - name: Generate verified owned-search sales pages
        run: node scripts/owned-sales-page-worker.mjs
      - name: Publish verified owned-search sales pages to existing GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          syncdir="$RUNNER_TEMP/prismbay-owned-sales-pages"
          git fetch origin gh-pages
          git worktree add --detach "$syncdir" origin/gh-pages
          git -C "$syncdir" config user.name 'github-actions[bot]'
          git -C "$syncdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$syncdir/learn"
          cp growth-reports/owned-sales-pages/*.html "$syncdir/learn/"
          node scripts/sales-sitemap-sync.mjs "$syncdir/sitemap.xml"
          git -C "$syncdir" add learn sitemap.xml
          if git -C "$syncdir" diff --cached --quiet; then
            echo 'Owned sales pages unchanged'
          else
            git -C "$syncdir" commit -m 'chore: publish verified PrismBay buyer acquisition pages'
            for attempt in 1 2 3; do
              git fetch origin gh-pages
              if ! git -C "$syncdir" rebase origin/gh-pages; then
                git -C "$syncdir" rebase --abort || true
                echo 'Concurrent gh-pages change requires review. No force push.'
                exit 1
              fi
              git -C "$syncdir" push origin HEAD:gh-pages && break
              if [[ "$attempt" == "3" ]]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
      - name: Coordinate dropshipping worker assignments and supplier blockers
        run: node scripts/dropshipping-dispatch.mjs
      - name: Publish sanitized dropshipping worker board for owner review
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # The research and growth workers leave tracked report changes in the
          # original checkout. Use an isolated worktree so a rebase never fails
          # with "You have unstaged changes" or discards useful run artifacts.
          snapshot="$RUNNER_TEMP/prismbay-worker-board.json"
          syncdir="$RUNNER_TEMP/prismbay-worker-board-publisher"
          cp growth-reports/dropshipping-worker-board.json "$snapshot"
          git fetch origin main
          git worktree add --detach "$syncdir" origin/main
          git -C "$syncdir" config user.name 'github-actions[bot]'
          git -C "$syncdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git -C "$syncdir" reset --hard origin/main
            # The CJ job can commit a newer review while a growth run executes.
            # Skip stale snapshots instead of rolling supplier evidence backwards.
            if ! node scripts/board-freshness.mjs "$snapshot" \
              "$syncdir/growth-reports/cj-worker-review.json" \
              "$syncdir/growth-reports/dropshipping-worker-board.json"; then
              echo 'Newer supplier evidence or worker board exists; retain artifact and skip stale publish'
              exit 0
            fi
            mkdir -p "$syncdir/growth-reports"
            cp "$snapshot" "$syncdir/growth-reports/dropshipping-worker-board.json"
            git -C "$syncdir" add -f growth-reports/dropshipping-worker-board.json
            if git -C "$syncdir" diff --cached --quiet; then
              echo 'Worker board unchanged'
              exit 0
            fi
            git -C "$syncdir" commit -m 'chore: update safe dropshipping worker board'
            if git -C "$syncdir" push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 3))"
          done
          echo 'Board commit failed; inspect retained run artifact'
          exit 1
      - name: Verify published public routes and catalog freshness
        run: node scripts/revenue-health-check.mjs
      - name: Complete only tasks captured before successful scheduled work
        if: success()
        env:
          PRISMBAY_CF_ENDPOINT: ${{ secrets.PRISMBAY_CF_ENDPOINT }}
          PRISMBAY_CF_REPORT_TOKEN: ${{ secrets.PRISMBAY_CF_REPORT_TOKEN }}
        run: node scripts/free-cloud-sync.mjs complete
      - name: Report execution to free Cloudflare control plane (optional)
        if: always()
        env:
          PRISMBAY_CF_ENDPOINT: ${{ secrets.PRISMBAY_CF_ENDPOINT }}
          PRISMBAY_CF_REPORT_TOKEN: ${{ secrets.PRISMBAY_CF_REPORT_TOKEN }}
          PRISMBAY_RUN_STATUS: ${{ job.status }}
        run: node scripts/free-cloud-sync.mjs report
      - name: Retain short-lived cloud execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-cloud-ops-${{ github.run_id }}
          path: |
            growth-reports/*.json
            growth-reports/owned-sales-pages/*.html
            growth-reports/owned-sales-pages/urls.json
            public/viral-catalog.json
          if-no-files-found: warn
          retention-days: 2
      - name: Write clear execution summary
        if: always()
        shell: bash
        run: echo 'Cloud execution completed. Verified owned-search pages are maintained on the existing GitHub Pages branch. No Stripe charges, CJ orders, cold emails, or social posts are initiated by this workflow.' >> "$GITHUB_STEP_SUMMARY"
