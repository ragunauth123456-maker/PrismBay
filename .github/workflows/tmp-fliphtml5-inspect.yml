name: Inspect FlipHTML5 MI05

on:
  push:
    branches:
      - tmp/fliphtml5-extract-mi05-20260928

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture high-resolution AGM feature spreads
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          cat > probe.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
          for (const p of [45,47,49]) {
            const page = await browser.newPage({viewport:{width:1440,height:1100}, deviceScaleFactor:2});
            await page.goto('https://online.fliphtml5.com/jeign/MI05/#p='+p,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(7000);
            await page.screenshot({path:'spread-'+p+'-2x.png',fullPage:true});
            await page.close();
          }
          await browser.close();
          NODE
          node probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mi05-agm-spreads-2x
          path: spread-*-2x.png
