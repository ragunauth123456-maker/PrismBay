name: Inspect FlipHTML5 MI05

on:
  push:
    branches:
      - tmp/fliphtml5-extract-mi05-20260928

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch config and test assets
        run: |
          set -euo pipefail
          base='https://online.fliphtml5.com/jeign/MI05'
          curl -L --compressed -A 'Mozilla/5.0' "$base/javascript/config.js" -o /tmp/config.js
          echo "CONFIG_SIZE=$(wc -c </tmp/config.js)"
          echo "---- config head ----"
          head -c 12000 /tmp/config.js
          echo
          echo "---- relevant config tokens ----"
          grep -Eoi '.{0,150}(download|pdf|source|file|page|large|thumb|text|bookConfig|pages).{0,300}' /tmp/config.js | head -n 300 || true
          echo "---- candidate URLs ----"
          grep -Eo 'https?://[^"'"'"' <>]+' /tmp/config.js | head -n 300 || true
          echo "---- test likely assets ----"
          for u in             "$base/files/download.pdf"             "$base/files/source.pdf"             "$base/files/MI05.pdf"             "$base/files/assets/basic-html/page-45.html"             "$base/files/large/45.webp"             "$base/files/large/45.jpg"             "$base/files/thumb/45.jpg"; do
              code=$(curl -L -s -o /dev/null -w '%{http_code}' "$u" || true)
              echo "$code $u"
          done
