name: Fetch FlipHTML5 Native Assets

on:
  push:
    branches:
      - tmp/fliphtml5-extract-mi05-20260928

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download native large page assets
        run: |
          set -euo pipefail
          python -m pip install pillow
          mkdir -p /tmp/native
          base='https://online.fliphtml5.com/jeign/MI05/files/large'
          hashes=(
            75aedac0b170a8568442352899a531c9
            7a42d69f3b55d8e14dfbbcfb13109424
            8a492a3d41a09b81ab6f52bcbd7380e2
            c4a2396662da664b20fb87773f1791d5
            c6907a03c28b6dc0a8fe58561c543b0b
            c9593907a62da86a962d48ad59b66920
            f7df3332e690494e9503f0f12fd06c08
            266c379dc140036880fee6e1e7648b4f
            6ee6f04a85273618318f7082d9876840
            38a5492e766ccf2e44af559ecf8905e3
            af3ccd00d30b2bab635e304dbea7f577
            4b5a90768f38cd487cfc7ad5b844faff
            eef9157fedfd96e860a074d7ce2abe75
          )
          for h in "${hashes[@]}"; do
            curl -L --fail --silent --show-error "$base/$h.webp?1790589566" -o "/tmp/native/$h.webp"
          done
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import glob,os,math
          files=sorted(glob.glob('/tmp/native/*.webp'))
          thumbs=[]
          for fn in files:
              im=Image.open(fn).convert('RGB')
              print(os.path.basename(fn),im.size)
              thumb=ImageOps.contain(im,(360,520))
              card=Image.new('RGB',(390,570),'white')
              card.paste(thumb,((390-thumb.width)//2,10))
              d=ImageDraw.Draw(card)
              d.text((8,540),os.path.basename(fn)[:16],fill='black')
              thumbs.append(card)
          cols=4; rows=math.ceil(len(thumbs)/cols)
          sheet=Image.new('RGB',(cols*390,rows*570),(220,220,220))
          for i,t in enumerate(thumbs): sheet.paste(t,((i%cols)*390,(i//cols)*570))
          sheet.save('/tmp/native/contact.jpg',quality=90)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mi05-native-candidate-pages
          path: /tmp/native/
