name: Map FlipHTML5 MI05 Page Assets

on:
  push:
    branches:
      - tmp/fliphtml5-extract-mi05-20260928

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Map native large assets to pages 44-50
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          cat > probe.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
          for (const p of [44,45,46,47,48,49,50]) {
            const ctx = await browser.newContext({viewport:{width:1400,height:1100}});
            const page = await ctx.newPage();
            const urls = new Set();
            page.on('request', r => {
              const u=r.url();
              if (/\/files\/large\/[^?]+\.(webp|jpg|png)/i.test(u)) urls.add(u);
            });
            await page.goto('https://online.fliphtml5.com/jeign/MI05/#p='+p,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(6500);
            console.log('PAGE',p);
            for (const u of [...urls].sort()) console.log(u);
            console.log('ENDPAGE',p);
            await ctx.close();
          }
          await browser.close();
          NODE
          node probe.mjs
